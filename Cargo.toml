[package]
name = "aimark"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local human and AI code provenance with a browser dashboard"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
form_urlencoded = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"
